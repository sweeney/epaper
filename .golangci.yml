version: "2"

linters:
  enable:
    - errcheck      # every failure is a returned error — PLAN §1.3
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused

  settings:
    revive:
      rules:
        # Every exported symbol carries a doc comment. This is the "docs" job
        # from PLAN §7, enforced by the linter rather than by a separate check.
        # Doc comments on the PUBLIC surface. Private receivers are
        # deliberately not included: the types implementing font.Face here
        # would gain eight comments that say only what the interface already
        # documents.
        - name: exported
          severity: error
          arguments: ["disableStutteringCheck"]
        - name: package-comments
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow

  exclusions:
    rules:
      # Test helpers may skip doc comments.
      - path: _test\.go
        linters: [revive]
      # `defer dev.Close()` is idiomatic in a test and the error cannot
      # change the outcome. Requiring `_ =` on every one of them would add
      # noise to the tests to satisfy a rule aimed at real code.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
