version: "2"

linters:
  enable:
    - errcheck      # every failure is a returned error — PLAN §1.3
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused

  settings:
    revive:
      rules:
        # Every exported symbol carries a doc comment. This is the "docs" job
        # from PLAN §7, enforced by the linter rather than by a separate check.
        - name: exported
          severity: error
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: package-comments
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow

  exclusions:
    rules:
      # Test helpers may skip doc comments.
      - path: _test\.go
        linters: [revive]

formatters:
  enable:
    - gofmt
